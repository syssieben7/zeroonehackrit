[project]
name = "hierarchical-fab-gpt"
version = "0.1.0"
description = "Hierarchical block-token GPT for semiconductor fab sequences"
channels = ["pytorch", "nvidia", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
pytorch = { version = "2.4.*", channel = "pytorch" }
pytorch-cuda = { version = "12.1.*", channel = "pytorch" }
transformers = ">=4.44,<4.47"
numpy = "<2"

[tasks]
train = "python train.py"
