[workspace]
name = "hierarchical-fab-gpt"
version = "0.1.0"
description = "Hierarchical block-token GPT for semiconductor fab sequences"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = "3.12.*"

[pypi-dependencies]
torch = ">=2.2"
transformers = ">=4.44"
numpy = ">=1.26,<2.0"

[tasks]
train = "python train.py"
