[workspace]
name = "hierarchical-fab-gpt"
version = "0.1.0"
description = "Hierarchical block-token GPT for semiconductor fab sequences"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = "3.12.*"
numpy = ">=1.26"

# provides GLIBCXX_3.4.29+ on HPC clusters with old system libstdc++
[target.linux-64.dependencies]
libstdcxx-ng = ">=12"

[pypi-dependencies]
torch = ">=2.2"
transformers = ">=4.44"

[tasks]
train = "python train.py"
